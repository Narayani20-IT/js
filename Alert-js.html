<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap + JavaScript Example</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">

    
</head>

<body>

<div class="container mt-5">
    <div class="card text-center shadow p-4">
        <h2 class="mb-3">Welcome to My Website</h2>

        <p id="message">
            Click the button below to see a greeting.
        </p>

        <button class="btn btn-primary" onclick="showMessage()">
            Click Me
        </button>
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").innerHTML = "Hello! Welcome to Bootstrap and JavaScript.";
}
</script>

</body>
</html>
